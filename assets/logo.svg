<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-nexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow-nexus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07090e" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <polygon points="32,8 56,22 56,42 32,56 8,42 8,22" stroke="url(#grad-nexus)" stroke-width="3" fill="rgba(0, 240, 255, 0.08)" filter="url(#glow-nexus)"/>
  <circle cx="32" cy="32" r="8" fill="url(#grad-nexus)"/>
  <line x1="32" y1="8" x2="32" y2="24" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="56" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="22" x2="24" y2="32" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="56" y2="42" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
